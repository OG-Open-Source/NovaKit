<!doctype html>
<html
	lang="en"
	data-theme="dark">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0" />
		<title>Docs Wiki Pages</title>
		<!-- Pico CSS -->
		<link
			rel="stylesheet"
			href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css" />
		<!-- GSAP -->
		<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
		<!-- Lucide Icons -->
		<script src="https://unpkg.com/lucide@latest"></script>

		<style>
			/* Custom Variables for Code Blocks */
			:root {
				--code-header-bg: #2d333b;
				--code-header-text: #adbac7;
				--code-bg: #22272e;
				--code-text: #c9d1d9;
				--nav-active: var(--pico-primary);
			}

			[data-theme='light'] {
				--code-header-bg: #f0f2f5;
				--code-header-text: #57606a;
				--code-bg: #ffffff;
				--code-text: #24292f;
			}

			/* Layout Tweaks */
			body {
				display: flex;
				flex-direction: column;
				min-height: 100vh;
			}

			main {
				flex: 1;
				padding-top: 1rem;
			}

			/* Navigation */
			nav ul li a {
				text-decoration: none;
				color: var(--pico-color);
				transition: color 0.3s;
				position: relative;
			}

			nav ul li a.active {
				color: var(--nav-active);
				font-weight: 700;
			}

			nav ul li a.active::after {
				content: '';
				position: absolute;
				bottom: -5px;
				left: 0;
				width: 100%;
				height: 2px;
				background-color: var(--nav-active);
			}

			/* Code Block Styling */
			.code-block-wrapper {
				margin: var(--pico-typography-spacing-vertical) 0;
				border: 1px solid var(--pico-muted-border-color);
				border-radius: var(--pico-border-radius);
				overflow: hidden;
				box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
			}

			.code-header {
				display: flex;
				justify-content: space-between;
				align-items: center;
				padding: 0.5rem 1rem;
				background-color: var(--code-header-bg);
				border-bottom: 1px solid var(--pico-muted-border-color);
				font-family: monospace;
				font-size: 0.85rem;
				color: var(--code-header-text);
			}

			.code-lang {
				text-transform: uppercase;
				font-weight: bold;
				font-size: 0.75rem;
				letter-spacing: 0.5px;
			}

			.copy-btn {
				background: transparent;
				border: none;
				color: inherit;
				padding: 4px 8px;
				font-size: 0.75rem;
				cursor: pointer;
				display: flex;
				align-items: center;
				gap: 6px;
				border-radius: 4px;
				transition: all 0.2s;
				margin-bottom: 0;
				line-height: 1;
				width: auto;
				height: auto;
			}

			.copy-btn:hover {
				background-color: rgba(128, 128, 128, 0.1);
				color: var(--pico-primary);
			}

			.copy-btn:focus {
				box-shadow: none;
			}

			/* Pre content overrides */
			pre.custom-pre {
				margin: 0;
				padding: 1rem;
				background-color: var(--code-bg);
				color: var(--code-text);
				border: none;
				border-radius: 0;
				overflow-x: auto;
			}

			pre.custom-pre code {
				background: transparent;
				color: inherit;
				padding: 0;
				font-family:
					ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
				font-size: 0.9em;
			}

			/* Inline Code Styling */
			.inline-code {
				background-color: var(--pico-code-background-color);
				color: var(--pico-code-color);
				padding: 0.2em 0.4em;
				border-radius: 4px;
				font-family:
					ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
				font-size: 0.9em;
			}

			/* Tab Content Transitions */
			.tab-pane {
				display: none;
				opacity: 0;
			}

			.tab-pane.active {
				display: block;
				opacity: 1;
			}

			/* Theme Toggle */
			#theme-toggle {
				padding: 0.5rem;
				border: none;
				background: transparent;
				color: var(--pico-color);
				display: flex;
				align-items: center;
				justify-content: center;
			}
		</style>
	</head>
	<body>
		<nav class="container">
			<ul>
				<li><strong>DevPlatform</strong></li>
			</ul>
			<ul>
				<li>
					<a
						href="#"
						class="nav-link active"
						data-target="docs"
						>Docs</a
					>
				</li>
				<li>
					<a
						href="#"
						class="nav-link"
						data-target="wiki"
						>Wiki</a
					>
				</li>
				<li>
					<a
						href="#"
						class="nav-link"
						data-target="pages"
						>Pages</a
					>
				</li>
				<li>
					<button
						id="theme-toggle"
						aria-label="Toggle Theme">
						<i
							data-lucide="moon"
							class="theme-icon"></i>
					</button>
				</li>
			</ul>
		</nav>

		<main class="container">
			<div id="content-container">
				<!-- Content will be injected here -->
			</div>
		</main>

		<footer class="container">
			<small>Built with Pico CSS, GSAP & Lucide</small>
		</footer>

		<script>
			// --- Data Source ---
			const contentData = {
				docs: `
# Documentation

Welcome to the official documentation. This section provides comprehensive guides and API references.

## Quick Start

To get started with the installation, run the following command in your terminal:

\`\`\`bash
npm install @awesome/library
\`\`\`

Once installed, you can import it into your project:

\`\`\`javascript
import { init } from '@awesome/library';

// Initialize the library
init({
  apiKey: 'YOUR_KEY_HERE',
  debug: true
});

console.log('Library initialized');
\`\`\`

## Configuration

You can configure the global settings using a \`config.json\` file.

\`\`\`json
{
  "theme": "dark",
  "retries": 3,
  "endpoints": {
    "api": "https://api.example.com/v1"
  }
}
\`\`\`

Use the \`loadConfig\` helper method to parse this file automatically.
            `,
				wiki: `
# Wiki

This is the community knowledge base.

## Core Concepts

The system is built on three pillars:
1. **Simplicity**
2. **Performance**
3. **Extensibility**

### Variable Types

We support strong typing. For example, use \`String\` for text and \`Int\` for whole numbers.

## Styling Guide

Here is how we style components using CSS:

\`\`\`css
.component {
  display: flex;
  justify-content: center;
  align-items: center;
  background: #f4f4f4;
  border-radius: 8px;
}

.component:hover {
  transform: translateY(-2px);
}
\`\`\`

> Remember to always keep your styles scoped to avoid side effects.
            `,
				pages: `
# Pages

Static pages and templates.

## About Us

We are a team of developers passionate about building clean and efficient web tools.

## Contact

Reach out to us via email or check our status page.

\`\`\`html
<section id="contact">
  <h2>Contact Us</h2>
  <form action="/submit">
    <input type="email" placeholder="Your Email" required>
    <button type="submit">Send</button>
  </form>
</section>
\`\`\`

### Inline Code Test
This is a test for \`inline code\` rendering within a paragraph to ensure it works correctly alongside **bold text** and normal text.
            `,
			};

			// --- Logic ---

			const contentContainer = document.getElementById('content-container');
			const navLinks = document.querySelectorAll('.nav-link');
			const themeToggle = document.getElementById('theme-toggle');
			const htmlEl = document.documentElement;
			let currentTab = 'docs';

			// 1. Markdown Renderer
			function parseMarkdown(text) {
				// Escape HTML to prevent injection (basic)
				let cleanText = text
					.replace(/&/g, '&amp;')
					.replace(/</g, '&lt;')
					.replace(/>/g, '&gt;');

				// 1. Block Code: ```suffix\nContent```
				// Regex looks for ```(lang)\n(content)```
				cleanText = cleanText.replace(
					/```(\S+)\n([\s\S]*?)```/g,
					(match, lang, code) => {
						return `
<div class="code-block-wrapper">
    <div class="code-header">
        <span class="code-lang">${lang}</span>
        <button class="copy-btn" onclick="copyCode(this)">
            <i data-lucide="copy" width="14" height="14"></i> Copy
        </button>
    </div>
    <pre class="custom-pre"><code>${code}</code></pre>
    <!-- Hidden textarea for copying -->
    <textarea style="display:none;">${code}</textarea>
</div>`;
					},
				);

				// 2. Inline Code: `text`
				cleanText = cleanText.replace(
					/`([^`]+)`/g,
					'<span class="inline-code">$1</span>',
				);

				// 3. Headers
				cleanText = cleanText.replace(/^# (.*$)/gim, '<h1>$1</h1>');
				cleanText = cleanText.replace(/^## (.*$)/gim, '<h2>$1</h2>');
				cleanText = cleanText.replace(/^### (.*$)/gim, '<h3>$1</h3>');

				// 4. Bold
				cleanText = cleanText.replace(/\*\*(.*)\*\*/gim, '<strong>$1</strong>');

				// 5. Lists (Basic dash)
				cleanText = cleanText.replace(/^\- (.*$)/gim, '<li>$1</li>');
				// Wrap lis in ul (simple heuristic: if we have lis, wrap them later or just let browsers handle loose lis somewhat or wrap adjacent lis.
				// For simplicity in this task, we'll just leave them as lis. Pico renders them okay-ish, but let's wrap them for correctness ideally.
				// But regex-only list wrapping is hard. Let's just convert them to div with bullet style or leave as is.
				// Better approach for single page task: just replace with bullet point character for visual simplicity or simple replace.
				// Let's use <ul> wrapping for sequences of <li> if possible, but strict regex is complex.
				// We will just leave them as <li> elements and ensure valid HTML by wrapping content in a div that allows flow content.

				// 6. Paragraphs (Double newline to <p>)
				// Split by double newline, then process non-html blocks
				const blocks = cleanText.split('\n\n');
				const processedBlocks = blocks
					.map((block) => {
						if (
							block.trim().startsWith('<div') ||
							block.trim().startsWith('<h')
						) {
							return block;
						}
						return `<p>${block.replace(/\n/g, '<br>')}</p>`;
					})
					.join('');

				return processedBlocks;
			}

			// 2. Render Content
			function renderContent(tabName) {
				const markdown = contentData[tabName] || '# 404 Not Found';
				const html = parseMarkdown(markdown);

				// Create a new container for GSAP animation
				const newDiv = document.createElement('div');
				newDiv.innerHTML = html;
				newDiv.style.opacity = 0;

				contentContainer.innerHTML = '';
				contentContainer.appendChild(newDiv);

				// Re-initialize icons for new content
				lucide.createIcons();

				// Animate in
				gsap.to(newDiv, {
					duration: 0.4,
					opacity: 1,
					y: 0,
					startAt: { y: 10 },
					ease: 'power2.out',
				});
			}

			// 3. Navigation Handling
			navLinks.forEach((link) => {
				link.addEventListener('click', (e) => {
					e.preventDefault();
					const target = link.getAttribute('data-target');

					if (target === currentTab) return;

					// Update Active State
					navLinks.forEach((l) => l.classList.remove('active'));
					link.classList.add('active');

					currentTab = target;
					renderContent(target);
				});
			});

			// 4. Theme Toggle
			function toggleTheme() {
				const currentTheme = htmlEl.getAttribute('data-theme');
				const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
				htmlEl.setAttribute('data-theme', newTheme);

				// Update Icon
				const icon = themeToggle.querySelector('.theme-icon');
				if (newTheme === 'light') {
					icon.setAttribute('data-lucide', 'sun');
				} else {
					icon.setAttribute('data-lucide', 'moon');
				}
				lucide.createIcons();
			}

			themeToggle.addEventListener('click', toggleTheme);

			// 5. Copy Functionality
			window.copyCode = function (btn) {
				const wrapper = btn.closest('.code-block-wrapper');
				const hiddenTextarea = wrapper.querySelector('textarea');
				const codeText = hiddenTextarea.value;

				navigator.clipboard
					.writeText(codeText)
					.then(() => {
						const originalHTML = btn.innerHTML;
						btn.innerHTML =
							'<i data-lucide="check" width="14" height="14"></i> Copied!';
						lucide.createIcons();

						setTimeout(() => {
							btn.innerHTML = originalHTML;
							lucide.createIcons();
						}, 2000);
					})
					.catch((err) => {
						console.error('Failed to copy:', err);
					});
			};

			// Init
			renderContent('docs');
			lucide.createIcons();
		</script>
	</body>
</html>
